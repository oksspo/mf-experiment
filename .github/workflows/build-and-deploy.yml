name: Build & Deploy Rsbuild Module Federation

on:
  push:
    branches: [ main ]
  # allow manual trigger
  workflow_dispatch:

# required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # folders with your rsbuild apps
        app: [hyperion, order]

    env:
      NODE_VERSION: 20

      # Public URLs where the built apps will be served on GitHub Pages
      HOST_PUBLIC_URL: https://<USER>.github.io/<REPO>/
      ORDER_PUBLIC_URL: https://<USER>.github.io/<REPO>/order

      # URL used by the host to load the remoteEntry of "order"
      ORDER_REMOTE_URL: https://<USER>.github.io/<REPO>/order

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build app with rsbuild
        working-directory: ${{ matrix.app }}
        env:
          # pass envs into rsbuild configs
          HOST_PUBLIC_URL: ${{ env.HOST_PUBLIC_URL }}
          ORDER_PUBLIC_URL: ${{ env.ORDER_PUBLIC_URL }}
          ORDER_REMOTE_URL: ${{ env.ORDER_REMOTE_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hyperion build
        uses: actions/download-artifact@v4
        with:
          name: hyperion-dist
          path: public-root

      - name: Download order build
        uses: actions/download-artifact@v4
        with:
          name: order-dist
          # will be served under /order
          path: public-root/order

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
